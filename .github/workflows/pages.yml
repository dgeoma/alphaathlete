name: Pubblica il sito

# Parte SOLO a mano (Actions → «Pubblica il sito» → Run workflow): niente va online senza il sì di George.
# Il giorno della pubblicazione, se si vuole che ogni push su main pubblichi, si rimette qui sotto:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # base_path è «/alphaathlete» finché il sito sta su utente.github.io/alphaathlete, vuoto col dominio collegato
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
      # Solo senza dominio: antepone la sottocartella agli indirizzi interni, altrimenti stili e immagini non si trovano.
      - run: node scripts/prefisso-anteprima.mjs "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
